name: WATCH REPAIR 005 Unseen WESAD Participants

on:
  push:
    paths:
      - 'wearable/experiments/wesad_repair_005.py'
      - 'wearable/tests/test_wesad_repair_005.py'
      - 'wearable/experiments/wesad_real_003.py'
      - '.github/workflows/wearable-wesad-repair-005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent_detector_comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific libraries
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'neurokit2>=0.2.10,<0.3' 'pytest>=8,<10' 'remotezip>=0.12,<1'
      - name: Run original plus repaired regression tests
        run: python -m pytest -q wearable/tests/test_wesad_real_003.py wearable/tests/test_wesad_repair_005.py
      - name: Test repaired wrist pulse method on five unseen original WESAD participants
        run: |
          python -m wearable.experiments.wesad_repair_005 --limit 5 --offset 2
      - name: Assert clinical-safety and out-of-development evaluation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('wearable/reports/WATCH_REPAIR_005.json').read_text())
          assert r['original_archive_verified'] is True
          assert r['participants_attempted'] == 5
          assert r['development_subjects_excluded']==2
          assert r['preliminary_unseen_participant_check'] is True
          assert r['number_of_true_clinical_ANS_labels']==0
          assert r['ANS_or_EDS_diagnostic_accuracy'] is None
          assert r['per_subject_data_shared'] is False
          assert all(v['n_valid_rate_pairs']+v['n_withheld_rate_pairs']==5 for v in r['results'].values())
          print('Unseen-sample and clinical guardrails verified.')
          PY
      - name: Upload aggregate-only scientific diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: watch-repair-005-unseen-aggregate
          path: wearable/reports/WATCH_REPAIR_005.json
          retention-days: 14
