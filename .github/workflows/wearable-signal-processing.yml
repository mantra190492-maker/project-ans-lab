name: Wrist Signal Extractor Regression

on:
  push:
    paths:
      - 'wearable/signal_processing.py'
      - 'wearable/tests/test_signal_processing.py'
      - '.github/workflows/wearable-signal-processing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected_rate_path:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'neurokit2>=0.2.10,<0.3' 'pytest>=8,<10'
      - name: Verify calibrated 25Hz processing path and error handling
        run: python -m pytest -q wearable/tests/test_signal_processing.py
