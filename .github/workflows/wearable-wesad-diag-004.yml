name: WATCH DIAG 004 Independent Sensor Detectors

on:
  push:
    paths:
      - 'wearable/experiments/wesad_diagnostic_004.py'
      - '.github/workflows/wearable-wesad-diag-004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detector_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent detectors
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'neurokit2>=0.2.10,<0.3' 'pytest>=8,<10' 'remotezip>=0.12,<1'
      - name: Regression tests
        run: python -m pytest -q wearable/tests/test_wesad_real_003.py
      - name: Original WESAD dual-detector diagnostic
        run: python -m wearable.experiments.wesad_diagnostic_004 --limit 2
      - name: Verify real source and result completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('wearable/reports/WATCH_DIAG_004.json').read_text())
          assert r['source_verified_original_archive'] is True
          assert r['subjects_attempted']==2
          assert r['clinical_diagnosis_accuracy'] is None
          assert not r['per_person_waveforms_or_features_published']
          for c in ('baseline','stress'):
              assert r['states'][c]['n_valid']+r['states'][c]['n_withheld']==2
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: watch-diag-004-aggregate-only
          path: wearable/reports/WATCH_DIAG_004.json
          retention-days: 14
