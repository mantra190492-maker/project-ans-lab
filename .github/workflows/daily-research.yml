name: ANS Literature Scout
on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m scripts.daily
      - run: python -m scripts.dataset_inventory
      - run: python -m scripts.archive
      - name: Commit persistent research archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/library.json reports/README.md
          git diff --cached --quiet || (git commit -m 'Archive daily ANS-001 literature metadata' && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: ans-001-research-report
          path: reports/
          retention-days: 14
