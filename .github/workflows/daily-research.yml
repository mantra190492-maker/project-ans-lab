name: ANS Literature Scout
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m scripts.daily
      - run: python -m scripts.dataset_inventory
      - uses: actions/upload-artifact@v4
        with:
          name: ans-001-research-report
          path: reports/
          retention-days: 14
