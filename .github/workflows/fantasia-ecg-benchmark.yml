name: ANS-001 ECG Annotation Benchmark
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fantasia_benchmark.py'
      - 'tests/test_fantasia_benchmark.py'
      - 'anslab/physio_qc.py'
      - 'requirements.txt'
      - '.github/workflows/fantasia-ecg-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ans-001-fantasia-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run all regression tests
        run: python -m pytest -q
      - name: Compare ECG detector with Fantasia human annotations
        run: python -m scripts.fantasia_benchmark
      - name: Publish scientific outcome in job summary
        if: always()
        run: |
          if [ -f reports/FANTASIA_ECG_BENCHMARK.md ]; then
            cat reports/FANTASIA_ECG_BENCHMARK.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist benchmark report without stale-branch merge conflicts
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f reports/FANTASIA_ECG_BENCHMARK.md ] || [ ! -f reports/fantasia_ecg_benchmark.json ]; then
            echo "No completed report to publish"
            exit 0
          fi
          scratch="$(mktemp -d)"
          cp reports/FANTASIA_ECG_BENCHMARK.md "$scratch/"
          cp reports/fantasia_ecg_benchmark.json "$scratch/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -f -B publish-ecg-report origin/main
            mkdir -p reports
            cp "$scratch/FANTASIA_ECG_BENCHMARK.md" reports/
            cp "$scratch/fantasia_ecg_benchmark.json" reports/
            git add -f reports/FANTASIA_ECG_BENCHMARK.md reports/fantasia_ecg_benchmark.json
            if git diff --cached --quiet; then
              echo "Benchmark report already published"
              exit 0
            fi
            git commit -m 'Archive independently annotated ECG benchmark [skip ci]'
            if git push origin HEAD:main; then
              echo "Benchmark report published"
              exit 0
            fi
            echo "Concurrent repository update; retrying publication ($attempt/3)"
            sleep $((attempt * 2))
          done
          echo "Unable to publish benchmark report after three attempts" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ans-001-fantasia-ecg-annotation-results
          path: |
            reports/FANTASIA_ECG_BENCHMARK.md
            reports/fantasia_ecg_benchmark.json
          if-no-files-found: warn
          retention-days: 30
