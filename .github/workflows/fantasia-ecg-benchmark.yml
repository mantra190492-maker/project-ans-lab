name: ANS-001 ECG Annotation Benchmark
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fantasia_benchmark.py'
      - 'tests/test_fantasia_benchmark.py'
      - 'anslab/physio_qc.py'
      - 'requirements.txt'
      - '.github/workflows/fantasia-ecg-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ans-001-fantasia-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run all regression tests
        run: python -m pytest -q
      - name: Compare ECG detector with Fantasia human annotations
        run: python -m scripts.fantasia_benchmark
      - name: Publish scientific outcome in job summary
        if: always()
        run: |
          if [ -f reports/FANTASIA_ECG_BENCHMARK.md ]; then
            cat reports/FANTASIA_ECG_BENCHMARK.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist benchmark report
        if: always()
        run: |
          if [ -f reports/FANTASIA_ECG_BENCHMARK.md ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f reports/FANTASIA_ECG_BENCHMARK.md reports/fantasia_ecg_benchmark.json
            if ! git diff --cached --quiet; then
              git commit -m 'Archive independently annotated ECG benchmark'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ans-001-fantasia-ecg-annotation-results
          path: |
            reports/FANTASIA_ECG_BENCHMARK.md
            reports/fantasia_ecg_benchmark.json
          if-no-files-found: warn
          retention-days: 30
