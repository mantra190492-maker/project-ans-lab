name: WATCH SYNC 007 Frozen Thirteen-Subject Holdout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wearable-wesad-sync-007-holdout.yml'

permissions:
  contents: read

jobs:
  heldout_real_wesad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install consistent dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'neurokit2>=0.2.10,<0.3' 'pytest>=8,<10' 'remotezip>=0.12,<1'
      - name: Run prespecified alignment and QC regressions
        run: python -m pytest -q wearable/tests/test_wesad_sync_007.py
      - name: Evaluate all thirteen remaining WESAD participants without retuning
        run: |
          python -m wearable.experiments.wesad_sync_007 --offset 2 --limit 13 --signal-rate 64 --output wearable/reports/WATCH_SYNC_007_HOLDOUT.json
      - name: Check exact denominators and research-only metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('wearable/reports/WATCH_SYNC_007_HOLDOUT.json').read_text())
          assert r['participants_attempted']==13
          assert r['subset_offset_in_prescribed_order']==2
          assert r['PPG_source_rate_hz']==64
          assert r['lag_range_seconds']==[-10,10]
          assert r['timing_train_seconds']==[10,30]
          assert r['timing_test_seconds']==[70,170]
          assert r['clinical_accuracy'] is None
          assert r['ecg_reference_manually_verified'] is False
          assert r['physical_pulse_transit_time_estimated'] is False
          assert r['source_data_published'] is False
          for state in ('baseline','stress'):
              x=r['results'][state]
              assert x['n_qc_processed']+x['n_wholly_withheld']==13
              assert x['eligible_epoch_count']<=x['total_epoch_count']<=65
              assert x['n_with_at_least_one_f1_epoch']<=x['n_confirmation_calibration_pass']
          print('Thirteen-subject aggregate timing/QC results verified.')
          PY
      - name: Archive aggregate only
        uses: actions/upload-artifact@v4
        with:
          name: watch-sync-007-thirteen-person-heldout-aggregate
          path: wearable/reports/WATCH_SYNC_007_HOLDOUT.json
          retention-days: 14
