name: ANS-001 open-data exploration loop
on:
  pull_request:
    paths:
      - 'scripts/explore.sh'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ans-001-explore
  cancel-in-progress: true
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Run the current exploration step
        run: bash scripts/explore.sh
      - name: Push QC plots to scratch branch (not part of the PR)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d qc ] && ls qc | grep -q . || exit 0
          cd qc
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -b claude/qc-artifacts
          git add -A
          git commit -q -m 'QC artifacts (scratch; open data)'
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:claude/qc-artifacts
      - name: Commit exploration reports to the PR branch
        if: always() && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          [ -d reports/explore ] && ls reports/explore | grep -q . || exit 0
          scratch="$(mktemp -d)"; cp -r reports/explore/. "$scratch/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$HEAD_REF"
            git checkout -f -B pr-head "origin/$HEAD_REF"
            mkdir -p reports/explore; cp -r "$scratch"/. reports/explore/
            git add -f reports/explore
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m 'PR run: archive exploration reports [skip ci]'
            if git push -q origin HEAD:"$HEAD_REF"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
