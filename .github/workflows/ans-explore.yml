name: ANS-001 open-data structure maps and blind segmentation plots
on:
  pull_request:
    paths:
      - 'scripts/dataset_structure.py'
      - 'scripts/cded_resp_plots.py'
      - 'scripts/cded_segmentation.py'
      - '.github/workflows/ans-explore.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ans-001-explore
  cancel-in-progress: true
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Structure maps of two more open diabetes datasets (no outcomes)
        run: |
          python -m scripts.dataset_structure --slug cerebral-perfusion-diabetes/1.0.1 --name CPD || true
          python -m scripts.dataset_structure --slug cerebral-vasoreg-diabetes/1.0.0 --name CVD || true
      - name: CDED non-cardiac channel plots (blind segmentation design)
        run: |
          if [ -f scripts/cded_segmentation.py ]; then
            python -m scripts.cded_segmentation --out qc
          else
            python -m scripts.cded_resp_plots --per-visit 5 --out qc
          fi
      - name: Push QC plots to scratch branch (not part of the PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d qc ] || exit 0
          cd qc
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -b claude/qc-artifacts
          git add -A
          git commit -q -m 'QC artifacts (scratch; open CDED data, non-cardiac channels)'
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:claude/qc-artifacts
      - name: Commit structure reports to the PR branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cp reports/STRUCTURE_*.* reports/CDED_SEGMENTATION.* "$scratch/" 2>/dev/null || true
          ls "$scratch" | grep -q . || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$HEAD_REF"
            git checkout -f -B pr-head "origin/$HEAD_REF"
            mkdir -p reports; cp "$scratch"/* reports/
            git add -f reports/STRUCTURE_*.* reports/CDED_SEGMENTATION.* 2>/dev/null || git add -f reports/STRUCTURE_*.*
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m 'PR run: archive structure reports [skip ci]'
            if git push -q origin HEAD:"$HEAD_REF"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
