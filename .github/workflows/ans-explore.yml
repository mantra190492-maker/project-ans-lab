name: ANS-001 open-data exploration loop
on:
  pull_request:
    paths:
      - 'scripts/explore.sh'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ans-001-explore
  cancel-in-progress: true
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Run only when the newest commit changed scripts/explore.sh
        id: gate
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qx 'scripts/explore.sh' || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest 'neurokit2>=0.2.10,<0.3'
        if: steps.gate.outputs.run == 'true'
      - run: python -m pytest -q
        if: steps.gate.outputs.run == 'true'
      - name: Run the current exploration step
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/explore.sh
      - name: Push QC plots to scratch branch (not part of the PR)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d qc ] && ls qc | grep -q . || exit 0
          cd qc
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -b claude/qc-artifacts
          git add -A
          git commit -q -m 'QC artifacts (scratch; open data)'
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:claude/qc-artifacts
      - name: Commit exploration reports to the PR branch
        if: always() && steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          [ -d reports/explore ] && ls reports/explore | grep -q . || exit 0
          scratch="$(mktemp -d)"; cp -r reports/explore/. "$scratch/"
          wscratch="$(mktemp -d)"; cp wearable/reports/FUSION_*.* "$wscratch/" 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$HEAD_REF"
            git checkout -f -B pr-head "origin/$HEAD_REF"
            mkdir -p reports/explore; cp -r "$scratch"/. reports/explore/
            mkdir -p wearable/reports; cp "$wscratch"/* wearable/reports/ 2>/dev/null || true
            git add -f reports/explore wearable/reports
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m 'PR run: archive exploration reports [skip ci]'
            if git push -q origin HEAD:"$HEAD_REF"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
