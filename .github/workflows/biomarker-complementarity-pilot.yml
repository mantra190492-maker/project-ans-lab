name: ANS DISC-002 Complementarity Pilot

on:
  push:
    paths:
      - "scripts/biomarker_complementarity_pilot.py"
      - "tests/test_biomarker_complementarity_pilot.py"
      - "reports/physionet_cohort.json"
      - ".github/workflows/biomarker-complementarity-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complementarity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required scientific libraries
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "pytest>=8,<10"
      - name: Run regression and QC gate tests
        run: python -m pytest -q tests/test_biomarker_complementarity_pilot.py
      - name: Recompute aggregate findings from committed public cohort features
        run: python -m scripts.biomarker_complementarity_pilot
      - name: Assert basic reproducibility gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/BIOMARKER_COMPLEMENTARITY_002.json").read_text())
          assert r["persons_total"]==20
          assert r["ecg_qc_pass"]==19
          assert r["provisional_brs_available"]==12
          assert r["brs_withheld_after_ecg_qc"]==7
          assert r["clinical_labels_present"] is False
          assert r["brs_independently_validated"] is False
          assert .7 < r["rmssd_brs_spearman_rho"] < .85
          PY
      - name: Publish aggregate diagnostics only
        uses: actions/upload-artifact@v4
        with:
          name: ans-disc-002-aggregate-diagnostics
          path: reports/BIOMARKER_COMPLEMENTARITY_002.json
          retention-days: 14
