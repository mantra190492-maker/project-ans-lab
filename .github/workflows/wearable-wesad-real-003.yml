name: WATCH REAL 003 WESAD Chest-vs-Wrist

on:
  workflow_dispatch:
  push:
    paths:
      - 'wearable/experiments/wesad_real_003.py'
      - 'wearable/tests/test_wesad_real_003.py'
      - '.github/workflows/wearable-wesad-real-003.yml'

permissions:
  contents: read

jobs:
  authentic_recording_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'pytest>=8,<10' 'remotezip>=0.12,<1'
      - name: Test source timing and quality gates
        run: python -m pytest -q wearable/tests/test_wesad_real_003.py
      - name: Read two original WESAD subjects with bounded HTTP ZIP range retrieval
        run: |
          python -m wearable.experiments.wesad_real_003 --archive-url 'https://uni-siegen.sciebo.de/s/HGdUkoNlW1Ub0Gx/download' --limit 2
      - name: Verify data source and absence of clinical overclaim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('wearable/reports/WATCH_REAL_003.json').read_text())
          assert r['source_verified_original_archive'] is True
          assert r['subjects_attempted'] == 2
          assert r['early_ANS_detection_accuracy'] is None
          assert r['per_subject_data_committed'] is False
          assert set(r['results']) == {'baseline','stress'}
          print('WATCH-REAL-003 source and aggregate output verified.')
          PY
      - name: Publish aggregate only (no subject-level waveforms)
        uses: actions/upload-artifact@v4
        with:
          name: watch-real-003-aggregate-only
          path: wearable/reports/WATCH_REAL_003.json
          retention-days: 14
