name: ANS-001 CDED stage 1b segment decoding (structure only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cded_segments.py'
      - 'tests/test_cded_inventory.py'
      - '.github/workflows/cded-segments.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ans-001-cded-segments
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Full test suite
        run: python -m pytest -q
      - name: Decode protocol markers (no physiological values)
        run: python -m scripts.cded_segments
      - name: Job summary
        if: always()
        run: '[ -f reports/CDED_SEGMENTS.md ] && cat reports/CDED_SEGMENTS.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Publish inventory
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"; cp reports/CDED_SEGMENTS.* "$scratch/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -f -B publish-cded-segments origin/main
            mkdir -p reports; cp "$scratch"/* reports/
            git add -f reports/CDED_SEGMENTS.*
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Archive CDED stage 1b segments [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Commit reports to the PR branch (readable via git)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cp reports/CDED_SEGMENTS.* "$scratch/" 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$HEAD_REF"
          git checkout -f -B pr-head "origin/$HEAD_REF"
          mkdir -p reports; cp "$scratch"/* reports/ 2>/dev/null || true
          git add -f reports/CDED_SEGMENTS.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PR run: archive reports [skip ci]'
          git push origin HEAD:"$HEAD_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cded-segments
          path: reports/CDED_SEGMENTS.*
          if-no-files-found: warn
