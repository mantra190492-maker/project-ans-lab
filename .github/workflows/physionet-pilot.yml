name: ANS-001 Real PhysioNet Pilot
on:
  push:
    branches: [main]
    paths:
      - 'scripts/physionet_pilot.py'
      - 'anslab/physiology.py'
      - 'requirements.txt'
      - '.github/workflows/physionet-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run 3-record ECG/BP feasibility experiment
        run: python -m scripts.physionet_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ans-001-physionet-pilot
          path: reports/physionet_pilot.json
          if-no-files-found: warn
          retention-days: 30
